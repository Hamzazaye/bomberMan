<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بومبر مان الكلاسيكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none; /* Prevent scrolling on mobile */
        }
        #game-container {
            position: relative;
            background-color: #4a9e2a; /* Green grass background */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 8px solid #333;
            border-radius: 8px;
        }
        canvas {
            display: block;
        }
        
        .ui-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            padding: 10px;
            background-color: #333;
            border: 4px solid #555;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        .hidden {
            display: none !important;
        }
        
        .btn {
            background-color: #e52521;
            color: white;
            border: 4px solid #fff;
            padding: 15px 30px;
            font-size: 16px;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.1s, background-color 0.2s;
        }
        
        .btn:hover {
            background-color: #ff3b37;
            transform: scale(1.05);
        }
        
        .btn:active {
            transform: scale(0.95);
        }

        #mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            #mobile-controls {
                display: grid;
            }
            .ui-panel {
                font-size: 12px;
            }
        }

        .control-btn {
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .control-btn:active {
            background-color: rgba(255, 255, 255, 0.5);
        }
        
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-bomb { grid-column: 2; grid-row: 2; background-color: rgba(229, 37, 33, 0.5); border-color: rgba(229, 37, 33, 0.8); }
        #btn-bomb:active { background-color: rgba(229, 37, 33, 0.8); }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
        
    </style>
</head>
<body>

    <h1 class="text-3xl text-yellow-400 mb-4 text-center text-shadow-md">بومبر مان</h1>
    
    <div class="ui-panel">
        <div>النقاط: <span id="score">0</span></div>
        <div>المستوى: <span id="level">1</span></div>
        <div>الأرواح: <span id="lives">3</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- شاشة البداية -->
        <div id="start-screen" class="overlay">
            <h2 class="text-4xl text-white mb-4 text-center leading-relaxed">بومبر مان</h2>
            <p class="text-sm text-gray-300 mb-8 text-center max-w-md leading-loose">
                استخدم الأسهم للحركة ومسطرة المسافات (Space) لوضع القنابل.<br>
                دمر الجدران القابلة للكسر واقضِ على الأعداء!
            </p>
            <button id="start-btn" class="btn">ابدأ اللعب</button>
        </div>

        <!-- شاشة النهاية -->
        <div id="game-over-screen" class="overlay hidden">
            <h2 class="text-4xl text-red-500 mb-4">انتهت اللعبة</h2>
            <p class="text-xl text-white mb-4">النقاط النهائية: <span id="final-score">0</span></p>
            <button id="restart-btn" class="btn">العب مرة أخرى</button>
        </div>
        
        <!-- شاشة الفوز بالمستوى -->
        <div id="level-complete-screen" class="overlay hidden">
            <h2 class="text-3xl text-yellow-400 mb-4">مستوى مكتمل!</h2>
            <button id="next-level-btn" class="btn">المستوى التالي</button>
        </div>
    </div>

    <!-- أزرار التحكم للموبايل -->
    <div id="mobile-controls">
        <div id="btn-up" class="control-btn">↑</div>
        <div id="btn-left" class="control-btn">←</div>
        <div id="btn-bomb" class="control-btn">💣</div>
        <div id="btn-right" class="control-btn">→</div>
        <div id="btn-down" class="control-btn">↓</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // إعدادات الشاشة والشبكة
        const TILE_SIZE = 40;
        const COLS = 15;
        const ROWS = 11;
        canvas.width = COLS * TILE_SIZE;
        canvas.height = ROWS * TILE_SIZE;

        // متغيرات حالة اللعبة
        let gameState = 'START'; // START, PLAYING, GAME_OVER, LEVEL_COMPLETE
        let score = 0;
        let lives = 3;
        let currentLevel = 1;
        let animationId;
        
        // مصفوفة الخريطة (0: فارغ, 1: جدار صلب, 2: جدار قابل للكسر)
        let map = [];
        let enemies = [];
        let bombs = [];
        let explosions = [];
        let powerups = []; // (0: قنابل إضافية, 1: مدى أطول)

        // إعدادات اللاعب
        const player = {
            x: TILE_SIZE,
            y: TILE_SIZE,
            width: TILE_SIZE * 0.8,
            height: TILE_SIZE * 0.8,
            speed: 2,
            color: 'white',
            dx: 0,
            dy: 0,
            maxBombs: 1,
            bombRange: 2,
            isInvulnerable: false,
            invulnerabilityTimer: 0
        };

        // تتبع المفاتيح المضغوطة
        const keys = {
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false,
            Space: false
        };

        const colors = {
            solidWall: '#666',
            solidWallInner: '#444',
            breakWall: '#c77d44',
            breakWallInner: '#a06030',
            grass: '#4a9e2a',
            playerHead: '#f4c2c2',
            playerBody: '#3b82f6',
            bomb: '#111',
            explosion: '#fbbf24',
            explosionCore: '#ef4444',
            enemy: '#ef4444',
            enemyEye: '#fff'
        };

        function initMap() {
            map = [];
            // بناء الإطار الخارجي والجدران الصلبة الداخلية
            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) {
                    // الجدران الخارجية أو الجدران الصلبة الداخلية (كل خانتين)
                    if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1 || (r % 2 === 0 && c % 2 === 0)) {
                        row.push(1); // جدار صلب
                    } else {
                        // مكان آمن لللاعب في البداية (الزاوية العلوية اليسرى ومحيطها)
                        if ((r === 1 && c === 1) || (r === 1 && c === 2) || (r === 2 && c === 1)) {
                            row.push(0); // فارغ
                        } else {
                            // فرصة لوضع جدار قابل للكسر
                            row.push(Math.random() < 0.6 ? 2 : 0);
                        }
                    }
                }
                map.push(row);
            }
        }

        function initEnemies() {
            enemies = [];
            let numEnemies = 2 + currentLevel; // تزيد الأعداء مع المستويات
            
            while (enemies.length < numEnemies) {
                let r = Math.floor(Math.random() * (ROWS - 2)) + 1;
                let c = Math.floor(Math.random() * (COLS - 2)) + 1;
                
                // التأكد من وضع العدو في مكان فارغ وبعيد عن اللاعب
                if (map[r][c] === 0 && (r > 3 || c > 3)) {
                    enemies.push({
                        x: c * TILE_SIZE + TILE_SIZE / 2,
                        y: r * TILE_SIZE + TILE_SIZE / 2,
                        radius: TILE_SIZE * 0.35,
                        speed: 1 + (currentLevel * 0.2), // الأعداء أسرع في المستويات المتقدمة
                        dx: Math.random() > 0.5 ? 1 : -1,
                        dy: 0,
                        directionTimer: 0
                    });
                }
            }
        }

        function resetPlayer() {
            player.x = TILE_SIZE + TILE_SIZE * 0.1;
            player.y = TILE_SIZE + TILE_SIZE * 0.1;
            player.dx = 0;
            player.dy = 0;
            player.isInvulnerable = true;
            player.invulnerabilityTimer = 120; // حوالي ثانيتين
        }

        function startLevel() {
            initMap();
            initEnemies();
            resetPlayer();
            bombs = [];
            explosions = [];
            powerups = [];
            document.getElementById('level').innerText = currentLevel;
            gameState = 'PLAYING';
            hideAllScreens();
        }

        function startGame() {
            score = 0;
            lives = 3;
            currentLevel = 1;
            player.maxBombs = 1;
            player.bombRange = 2;
            updateUI();
            startLevel();
        }

        window.addEventListener('keydown', (e) => {
            if (gameState !== 'PLAYING') return;
            switch(e.code) {
                case 'ArrowUp': keys.ArrowUp = true; break;
                case 'ArrowDown': keys.ArrowDown = true; break;
                case 'ArrowLeft': keys.ArrowLeft = true; break;
                case 'ArrowRight': keys.ArrowRight = true; break;
                case 'Space': 
                    if (!keys.Space) placeBomb();
                    keys.Space = true; 
                    e.preventDefault(); // منع نزول الصفحة
                    break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'ArrowUp': keys.ArrowUp = false; break;
                case 'ArrowDown': keys.ArrowDown = false; break;
                case 'ArrowLeft': keys.ArrowLeft = false; break;
                case 'ArrowRight': keys.ArrowRight = false; break;
                case 'Space': keys.Space = false; break;
            }
        });

        // إعداد أزرار اللمس للموبايل
        const setupTouchBtn = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); if (key === 'Space') { if(!keys.Space) placeBomb(); } keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); if (key === 'Space') { if(!keys.Space) placeBomb(); } keys[key] = true; });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener('mouseleave', (e) => { e.preventDefault(); keys[key] = false; });
        };

        setupTouchBtn('btn-up', 'ArrowUp');
        setupTouchBtn('btn-down', 'ArrowDown');
        setupTouchBtn('btn-left', 'ArrowLeft');
        setupTouchBtn('btn-right', 'ArrowRight');
        setupTouchBtn('btn-bomb', 'Space');

        function isCollision(x, y, width, height, skipBombs = false) {
            // التحقق من زوايا المربع المحيط
            const corners = [
                { cx: x, cy: y },
                { cx: x + width, cy: y },
                { cx: x, cy: y + height },
                { cx: x + width, cy: y + height }
            ];

            for (let corner of corners) {
                let gridC = Math.floor(corner.cx / TILE_SIZE);
                let gridR = Math.floor(corner.cy / TILE_SIZE);

                // اصطدام مع الجدران
                if (map[gridR] && (map[gridR][gridC] === 1 || map[gridR][gridC] === 2)) {
                    return true;
                }

                // اصطدام مع القنابل (إذا لم يتم تخطيها)
                if (!skipBombs) {
                    for (let b of bombs) {
                        let bx = b.c * TILE_SIZE;
                        let by = b.r * TILE_SIZE;
                        // تحقق بسيط من التداخل مع مربع القنبلة
                        if (corner.cx > bx && corner.cx < bx + TILE_SIZE &&
                            corner.cy > by && corner.cy < by + TILE_SIZE) {
                            // السماح للاعب بالخروج من القنبلة التي وضعها للتو
                            if (!b.solidToPlayer) {
                                continue;
                            }
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function updatePlayer() {
            let nextX = player.x;
            let nextY = player.y;

            if (keys.ArrowUp) nextY -= player.speed;
            if (keys.ArrowDown) nextY += player.speed;
            if (keys.ArrowLeft) nextX -= player.speed;
            if (keys.ArrowRight) nextX += player.speed;

            // تحريك في محور X فقط إذا لم يكن هناك اصطدام
            if (nextX !== player.x && !isCollision(nextX, player.y, player.width, player.height)) {
                player.x = nextX;
            } else if (nextX !== player.x) {
                 // مساعدة في الانزلاق حول الزوايا
                 const gridY = Math.floor((player.y + player.height/2) / TILE_SIZE) * TILE_SIZE;
                 if (player.y > gridY + player.speed) player.y -= player.speed;
                 else if (player.y < gridY - player.speed) player.y += player.speed;
            }

            // تحريك في محور Y فقط إذا لم يكن هناك اصطدام
            if (nextY !== player.y && !isCollision(player.x, nextY, player.width, player.height)) {
                player.y = nextY;
            } else if (nextY !== player.y) {
                 // مساعدة في الانزلاق حول الزوايا
                 const gridX = Math.floor((player.x + player.width/2) / TILE_SIZE) * TILE_SIZE;
                 if (player.x > gridX + player.speed) player.x -= player.speed;
                 else if (player.x < gridX - player.speed) player.x += player.speed;
            }

            // تقليل مؤقت المناعة
            if (player.invulnerabilityTimer > 0) {
                player.invulnerabilityTimer--;
                if (player.invulnerabilityTimer === 0) {
                    player.isInvulnerable = false;
                }
            }

            // التقاط التطويرات (Powerups)
            const playerCenterC = Math.floor((player.x + player.width/2) / TILE_SIZE);
            const playerCenterR = Math.floor((player.y + player.height/2) / TILE_SIZE);
            
            for (let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i];
                if (p.c === playerCenterC && p.r === playerCenterR) {
                    if (p.type === 0) {
                        player.maxBombs++;
                        score += 50;
                    } else if (p.type === 1) {
                        player.bombRange++;
                        score += 50;
                    }
                    powerups.splice(i, 1);
                    updateUI();
                }
            }
        }

        function placeBomb() {
            // حساب الخانة الحالية للاعب
            const c = Math.floor((player.x + player.width / 2) / TILE_SIZE);
            const r = Math.floor((player.y + player.height / 2) / TILE_SIZE);

            // التحقق من الحد الأقصى للقنابل وعدم وجود قنبلة في نفس المكان
            if (bombs.length < player.maxBombs && !bombs.some(b => b.c === c && b.r === r)) {
                bombs.push({
                    c: c,
                    r: r,
                    timer: 180, // 3 ثواني (بافتراض 60 إطار في الثانية)
                    range: player.bombRange,
                    solidToPlayer: false // القنبلة ليست صلبة للاعب في البداية حتى يبتعد عنها
                });
            }
        }

        function updateBombs() {
            for (let i = bombs.length - 1; i >= 0; i--) {
                let b = bombs[i];
                b.timer--;

                // التحقق مما إذا كان اللاعب قد ابتعد عن القنبلة لتصبح صلبة
                if (!b.solidToPlayer) {
                    const playerRect = {x: player.x, y: player.y, w: player.width, h: player.height};
                    const bombRect = {x: b.c * TILE_SIZE, y: b.r * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE};
                    
                    // إذا لم يعد هناك تداخل، تصبح صلبة
                    if (playerRect.x > bombRect.x + bombRect.w || playerRect.x + playerRect.w < bombRect.x ||
                        playerRect.y > bombRect.y + bombRect.h || playerRect.y + playerRect.h < bombRect.y) {
                        b.solidToPlayer = true;
                    }
                }

                if (b.timer <= 0) {
                    explodeBomb(i);
                }
            }
        }

        function explodeBomb(index) {
            let b = bombs[index];
            bombs.splice(index, 1);
            
            // إنشاء تأثير الانفجار المركزي
            createExplosion(b.c, b.r);

            // اتجاهات الانفجار: أعلى، يمين، أسفل، يسار
            const dirs = [{dc: 0, dr: -1}, {dc: 1, dr: 0}, {dc: 0, dr: 1}, {dc: -1, dr: 0}];

            for (let dir of dirs) {
                for (let i = 1; i <= b.range; i++) {
                    let ec = b.c + dir.dc * i;
                    let er = b.r + dir.dr * i;
                    
                    if (er >= 0 && er < ROWS && ec >= 0 && ec < COLS) {
                        let cell = map[er][ec];
                        
                        if (cell === 1) {
                            // جدار صلب يوقف الانفجار
                            break;
                        } else if (cell === 2) {
                            // تدمير جدار قابل للكسر
                            map[er][ec] = 0;
                            createExplosion(ec, er);
                            score += 10;
                            
                            // فرصة لظهور تطوير (Powerup)
                            if (Math.random() < 0.25) {
                                powerups.push({
                                    c: ec, r: er,
                                    type: Math.random() < 0.5 ? 0 : 1 // 0: قنبلة, 1: لهب
                                });
                            }
                            updateUI();
                            break; // الانفجار يتوقف عند الجدار القابل للكسر
                        } else {
                            // مساحة فارغة، يستمر الانفجار
                            createExplosion(ec, er);
                            
                            // هل أصاب الانفجار قنبلة أخرى؟ (تفاعل متسلسل)
                            let otherBombIdx = bombs.findIndex(ob => ob.c === ec && ob.r === er);
                            if (otherBombIdx !== -1) {
                                // تنفجر القنبلة الأخرى في الإطار التالي
                                bombs[otherBombIdx].timer = 1; 
                            }
                        }
                    }
                }
            }
        }

        function createExplosion(c, r) {
            explosions.push({
                c: c,
                r: r,
                timer: 30 // مدة بقاء الانفجار على الشاشة (نصف ثانية)
            });
            
            // تدمير التطويرات إذا أصابها الانفجار
            for (let i = powerups.length - 1; i >= 0; i--) {
                if (powerups[i].c === c && powerups[i].r === r) {
                    powerups.splice(i, 1);
                }
            }
        }

        function updateExplosions() {
            // التحقق من اصطدام اللاعب بالانفجار
            if (!player.isInvulnerable) {
                const playerC = Math.floor((player.x + player.width/2) / TILE_SIZE);
                const playerR = Math.floor((player.y + player.height/2) / TILE_SIZE);
                
                if (explosions.some(e => e.c === playerC && e.r === playerR)) {
                    killPlayer();
                }
            }

            // التحقق من اصطدام الأعداء بالانفجار
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let ec = Math.floor(e.x / TILE_SIZE);
                let er = Math.floor(e.y / TILE_SIZE);
                
                if (explosions.some(ex => ex.c === ec && ex.r === er)) {
                    enemies.splice(i, 1);
                    score += 100;
                    updateUI();
                    
                    // فحص اكتمال المستوى
                    if (enemies.length === 0) {
                        setTimeout(() => {
                            gameState = 'LEVEL_COMPLETE';
                            document.getElementById('level-complete-screen').classList.remove('hidden');
                        }, 1000);
                    }
                }
            }

            // تقليل وقت الانفجار وإزالته
            for (let i = explosions.length - 1; i >= 0; i--) {
                explosions[i].timer--;
                if (explosions[i].timer <= 0) {
                    explosions.splice(i, 1);
                }
            }
        }

        function updateEnemies() {
            for (let enemy of enemies) {
                enemy.directionTimer--;

                // تغيير الاتجاه عشوائياً أو عند الاصطدام
                if (enemy.directionTimer <= 0) {
                    chooseNewEnemyDirection(enemy);
                }

                let nextX = enemy.x + enemy.dx * enemy.speed;
                let nextY = enemy.y + enemy.dy * enemy.speed;
                
                // حجم تقريبي للعدو للاصطدام
                let eSize = enemy.radius * 2 * 0.8; 
                let cornerX = nextX - eSize/2;
                let cornerY = nextY - eSize/2;

                if (!isCollision(cornerX, cornerY, eSize, eSize, true)) {
                    enemy.x = nextX;
                    enemy.y = nextY;
                } else {
                    // اصطدم بشيء، اختر اتجاهاً جديداً فوراً
                    chooseNewEnemyDirection(enemy);
                }
                
                // التحقق من اصطدام العدو باللاعب
                if (!player.isInvulnerable && gameState === 'PLAYING') {
                    // حساب المسافة بين مركز اللاعب ومركز العدو
                    let px = player.x + player.width/2;
                    let py = player.y + player.height/2;
                    let dist = Math.hypot(px - enemy.x, py - enemy.y);
                    
                    if (dist < (player.width/2 + enemy.radius * 0.8)) {
                        killPlayer();
                    }
                }
            }
        }

        function chooseNewEnemyDirection(enemy) {
            enemy.directionTimer = Math.random() * 60 + 30; // الحفاظ على الاتجاه لنصف ثانية إلى ثانية ونصف
            const dirs = [{dx: 1, dy: 0}, {dx: -1, dy: 0}, {dx: 0, dy: 1}, {dx: 0, dy: -1}];
            
            // محاولة العثور على اتجاه غير مسدود
            let validDirs = [];
            let eSize = enemy.radius * 2 * 0.8;
            
            for (let dir of dirs) {
                let testX = enemy.x + dir.dx * enemy.speed * 5; // اختبار لمدى بسيط
                let testY = enemy.y + dir.dy * enemy.speed * 5;
                if (!isCollision(testX - eSize/2, testY - eSize/2, eSize, eSize, true)) {
                    validDirs.push(dir);
                }
            }
            
            if (validDirs.length > 0) {
                let chosenDir = validDirs[Math.floor(Math.random() * validDirs.length)];
                enemy.dx = chosenDir.dx;
                enemy.dy = chosenDir.dy;
            } else {
                enemy.dx = 0;
                enemy.dy = 0;
            }
        }

        function killPlayer() {
            lives--;
            updateUI();
            
            if (lives <= 0) {
                gameState = 'GAME_OVER';
                document.getElementById('final-score').innerText = score;
                document.getElementById('game-over-screen').classList.remove('hidden');
            } else {
                // إعادة اللاعب لنقطة البداية مع مناعة مؤقتة
                resetPlayer();
            }
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('lives').innerText = lives;
        }

        function hideAllScreens() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('level-complete-screen').classList.add('hidden');
        }

        function drawMap() {
            ctx.fillStyle = colors.grass;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let x = c * TILE_SIZE;
                    let y = r * TILE_SIZE;
                    
                    if (map[r][c] === 1) { // جدار صلب
                        ctx.fillStyle = colors.solidWall;
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = colors.solidWallInner;
                        ctx.fillRect(x + 4, y + 4, TILE_SIZE - 8, TILE_SIZE - 8);
                    } else if (map[r][c] === 2) { // جدار قابل للكسر
                        ctx.fillStyle = colors.breakWall;
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = colors.breakWallInner;
                        // رسم نمط طوب بسيط
                        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE/2 - 3);
                        ctx.fillRect(x + 2, y + TILE_SIZE/2 + 1, TILE_SIZE - 4, TILE_SIZE/2 - 3);
                    }
                }
            }
        }

        function drawPowerups() {
            for (let p of powerups) {
                let x = p.c * TILE_SIZE + TILE_SIZE / 2;
                let y = p.r * TILE_SIZE + TILE_SIZE / 2;
                
                ctx.beginPath();
                ctx.arc(x, y, TILE_SIZE * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#000';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = '12px "Press Start 2P"';
                
                if (p.type === 0) {
                    ctx.fillText('B', x, y); // Bomb icon
                } else {
                    ctx.fillText('F', x, y); // Fire/Range icon
                }
            }
        }

        function drawBombs() {
            for (let b of bombs) {
                let x = b.c * TILE_SIZE + TILE_SIZE / 2;
                let y = b.r * TILE_SIZE + TILE_SIZE / 2;
                
                // تأثير النبض للقنبلة
                let scale = 1 + Math.sin(b.timer * 0.2) * 0.1;
                let radius = TILE_SIZE * 0.35 * scale;

                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = colors.bomb;
                ctx.fill();

                // فتيل القنبلة
                ctx.beginPath();
                ctx.moveTo(x, y - radius);
                ctx.lineTo(x + 5, y - radius - 10);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // شرارة الفتيل
                if (b.timer % 10 < 5) {
                    ctx.fillStyle = '#ff0';
                    ctx.beginPath();
                    ctx.arc(x + 5, y - radius - 10, 3, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }

        function drawExplosions() {
            for (let ex of explosions) {
                let x = ex.c * TILE_SIZE;
                let y = ex.r * TILE_SIZE;
                
                // لون الانفجار الخارجي
                ctx.fillStyle = colors.explosion;
                ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                
                // لون الانفجار الداخلي الحار
                ctx.fillStyle = colors.explosionCore;
                let coreSize = (ex.timer / 30) * (TILE_SIZE - 12);
                let offset = (TILE_SIZE - coreSize) / 2;
                ctx.fillRect(x + offset, y + offset, coreSize, coreSize);
            }
        }

        function drawEnemies() {
            for (let enemy of enemies) {
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                ctx.fillStyle = colors.enemy;
                ctx.fill();
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 2;
                ctx.stroke();

                // رسم العيون
                ctx.fillStyle = colors.enemyEye;
                ctx.beginPath(); ctx.arc(enemy.x - 5, enemy.y - 4, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(enemy.x + 5, enemy.y - 4, 3, 0, Math.PI*2); ctx.fill();
                
                // بؤبؤ العين (ينظر في اتجاه الحركة)
                ctx.fillStyle = '#000';
                let pupilOffset = enemy.dx * 1.5; // التقريب
                ctx.beginPath(); ctx.arc(enemy.x - 5 + pupilOffset, enemy.y - 4, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(enemy.x + 5 + pupilOffset, enemy.y - 4, 1.5, 0, Math.PI*2); ctx.fill();
            }
        }

        function drawPlayer() {
            // وميض اللاعب أثناء المناعة
            if (player.isInvulnerable && Math.floor(Date.now() / 100) % 2 === 0) {
                return;
            }

            let px = player.x;
            let py = player.y;
            let pw = player.width;
            let ph = player.height;

            // رسم الجسم (أزرق)
            ctx.fillStyle = colors.playerBody;
            ctx.fillRect(px + 4, py + ph/2, pw - 8, ph/2 - 2);

            // رسم الرأس (وردي)
            ctx.fillStyle = colors.playerHead;
            ctx.fillRect(px + 4, py + 4, pw - 8, ph/2);
            
            // قبعة أو خوذة بسيطة
            ctx.fillStyle = '#fff';
            ctx.fillRect(px + 2, py + 2, pw - 4, 8);
            ctx.fillStyle = colors.playerBody;
            ctx.fillRect(px + pw/2 - 4, py - 4, 8, 6);

            // العيون
            ctx.fillStyle = '#000';
            ctx.fillRect(px + 8, py + 12, 4, 4);
            ctx.fillRect(px + pw - 12, py + 12, 4, 4);
        }

        function gameLoop() {
            if (gameState === 'PLAYING') {
                updatePlayer();
                updateBombs();
                updateExplosions();
                updateEnemies();
            }

            // مسح الشاشة
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState !== 'START') {
                drawMap();
                drawPowerups();
                drawBombs();
                drawExplosions();
                drawEnemies();
                if (gameState !== 'GAME_OVER') {
                    drawPlayer();
                }
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        // إعداد أزرار الواجهة
        document.getElementById('start-btn').addEventListener('click', () => {
            startGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            startGame();
        });

        document.getElementById('next-level-btn').addEventListener('click', () => {
            currentLevel++;
            startLevel();
        });

        // بدء حلقة الرسوميات الأولية (الشاشة فارغة تقريباً)
        initMap();
        drawMap();
        gameLoop();

    </script>
</body>
</html>
